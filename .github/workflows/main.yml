name: Minify JS
on: [push]

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Minify JavaScript
        uses: nizarmah/auto-minify@v3
        with:
          directory: '.'          # Input directory
          output: '.'            # Output directory for minified files
          js_engine: 'babel'        # Engine: babel or uglify-js
          overwrite: false          # Keep original; true overwrites input

      - name: Commit minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add minified JS files"   
